services:
  nats:
    image: nats:latest
    container_name: cdc-nats
    command: -js -sd /data -m 8222
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  faststream:
    build:
      context: ./consumer
    container_name: cdc-faststream-bridge
    restart: unless-stopped
    depends_on:
      - nats
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./consumer:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  debezium:
    image: quay.io/debezium/server:3.0
    container_name: cdc-debezium
    restart: unless-stopped
    depends_on:
      - nats
      - faststream
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties
      - ./univ-reg.creds:/debezium/config/univ-reg.creds
      - debezium-data:/debezium/data
    environment:
      - DEBEZIUM_OPTS=-Xmx256m
    extra_hosts:
      - "host.docker.internal:host-gateway"

  doc-request-sync:
    build:
      context: ./consumer
    container_name: cdc-doc-request-sync
    command: python sync_document_requests.py
    depends_on:
      - nats
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./consumer:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  legacy-sync:
    build:
      context: ./consumer
    container_name: cdc-legacy-sync
    command: python sync_legacy_students.py
    depends_on:
      - nats
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./consumer:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  nats-data:
  debezium-data:
