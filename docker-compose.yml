services:
  nats:
    image: nats:latest
    command: -js -sd /data -m 8222
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  faststream:
    build:
      context: ./consumer
    restart: unless-stopped
    depends_on:
      - nats
    ports:
      - "8000:8000"
    environment:
      - LOCAL_NATS_URL=nats://nats:4222
      - NATS_CREDS=/app/univ-reg.creds
      - MYSQL_URL=mysql+pymysql://root:@host.docker.internal/registrar-cvsu
    volumes:
      - ./consumer:/app
      - c:\laragon\www\student-profile-cdc-deployment\univ-reg.creds:/app/univ-reg.creds
    extra_hosts:
      - "host.docker.internal:host-gateway"

  debezium:
    image: quay.io/debezium/server:3.0
    restart: unless-stopped
    depends_on:
      - nats
      - faststream
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties
      - c:\laragon\www\student-profile-cdc-deployment\univ-reg.creds:/debezium/config/univ-reg.creds
      - debezium-data:/debezium/data
    environment:
      - DEBEZIUM_OPTS=-Xmx256m
    extra_hosts:
      - "host.docker.internal:host-gateway"

  legacy-sync:
    build:
      context: ./consumer
    command: python sync_all.py
    depends_on:
      - nats
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - NATS_URL=nats://192.168.10.130:4222
      - NATS_CREDS=/app/univ-reg.creds
      - MYSQL_URL=mysql+pymysql://root:@host.docker.internal/registrar-cvsu
    volumes:
      - ./consumer:/app
      - c:\laragon\www\student-profile-cdc-deployment\univ-reg.creds:/app/univ-reg.creds
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  nats-data:
  debezium-data:
